# tmux/tmux.conf — Kanagawa-themed tmux configuration

# Use the user's fish shell wherever it lives (macOS Homebrew vs Arch).
if-shell '[ -x /opt/homebrew/bin/fish ]' 'set -g default-shell /opt/homebrew/bin/fish' 'set -g default-shell /usr/bin/fish'

# --- General ---
set -g default-terminal "tmux-256color"
# True color passthrough for Ghostty and kitty
set -ag terminal-overrides ",xterm-ghostty:Tc"
set -ag terminal-overrides ",kitty:Tc"
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
# OSC52 clipboard: tmux-internal copies (mouse drag) land in the system
# clipboard of the outer terminal. Force-enable for Ghostty/kitty.
set -as terminal-features ",xterm-ghostty:clipboard"
set -as terminal-features ",kitty:clipboard"
setw -g mode-keys vi

# --- Prefix (screen-style C-a) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Panes and windows ---
# Splits and new windows inherit the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Reload this config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Wheel: 10 lines per notch in copy mode (default 5) — fewer redraws
# per distance when scrolling through huge logs. Tune to taste (5..15).
bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# Cheatsheet popup (dots/tmux/cheatsheet.md)
bind h display-popup -E -w 90% -h 80% "less -R ~/.config/tmux/cheatsheet.md"

# --- Copy mode (vi-style) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Status bar (Kanagawa powerline) ---
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#2a2a37,fg=#dcd7ba"
set -g status-left-length 40
set -g status-right-length 60
# Session chip in oniViolet
set -g status-left "#[fg=#16161d,bg=#957fb8,bold] #S #[fg=#957fb8,bg=#2a2a37]"
# Active window chip in crystalBlue; inactive windows stay dim
set -g window-status-current-format "#[fg=#7e9cd8,bg=#2a2a37]#[fg=#16161d,bg=#7e9cd8,bold] #I  #W #[fg=#7e9cd8,bg=#2a2a37]"
set -g window-status-format "#[fg=#727169,bg=#2a2a37]#I  #W "
set -g window-status-separator ""
# Date and time chips on sumiInkFour, clock glyph before the time
set -g status-right "#[fg=#363646,bg=#2a2a37]#[fg=#dcd7ba,bg=#363646] %a %d %b #[fg=#363646,bg=#2a2a37]#[fg=#c8c093,bg=#363646]  %H:%M #[fg=#363646,bg=#2a2a37]"

# --- Plugins (managed by TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Plugin settings ---
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# TPM must stay the last line
run '~/.tmux/plugins/tpm/tpm'
