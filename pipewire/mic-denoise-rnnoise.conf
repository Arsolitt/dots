context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (noise cancelled)"
            media.name       = "Microphone (noise cancelled)"
            audio.rate       = 48000
            audio.position   = [ MONO ]
            filter.graph = {
                nodes = [
                    { type    = ladspa
                      name    = rnnoise
                      plugin  = /home/arsolitt/.local/lib/ladspa/librnnoise_ladspa.so
