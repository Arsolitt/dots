# Keep power-profiles-daemon off the ACPI platform_profile interface.
# The Xiaomi bitland-mifs-wmi handler rejects performance mode while the laptop
# is powered over USB-C, which fails the whole aggregate write; the intel_pstate
# CPU driver alone does change energy_performance_preference.
[Service]
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=platform_profile
